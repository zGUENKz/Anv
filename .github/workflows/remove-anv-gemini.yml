name: Remove Anv Gemini Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-anv-gemini.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, '[remove-anv-gemini]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove Gemini bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('<script src="./anv-gemini-bridge.js"></script>\n','')
          p.write_text(text,encoding='utf-8')
          PY
          rm -f anv-gemini-bridge.js
      - name: Commit cleanup and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm .github/workflows/remove-anv-gemini.yml
          git commit -m '[remove-anv-gemini] remove unused Gemini bridge'
          git push origin HEAD:main
