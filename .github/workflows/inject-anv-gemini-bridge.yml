name: Inject Anv Gemini Bridge

on:
  push:
    branches: [main]
    paths:
      - 'anv-gemini-bridge.js'
      - '.github/workflows/inject-anv-gemini-bridge.yml'

permissions:
  contents: write

jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[anv-gemini-bridge]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Inject bridge script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="./anv-gemini-bridge.js"></script>'
          if tag not in text:
              marker='</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text=text.replace(marker, tag+'\n'+marker, 1)
              p.write_text(text,encoding='utf-8')
          PY

      - name: Commit injection and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/inject-anv-gemini-bridge.yml
          git commit -m '[anv-gemini-bridge] inject Gemini bridge'
          git push origin HEAD:main
