name: Fix anniversary month lock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix month unlock schedule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''function isMonthUnlocked(month){\n    return new Date() >= monthDate(month);\n}'''
          new = '''function isMonthUnlocked(month){\n    if(month === 1) return new Date() >= new Date(CONFIG.startDate+"T00:00:00");\n    return new Date() >= monthDate(month+1);\n}'''
          if old not in s:
              raise SystemExit('target code not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-month-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-month-lock.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix anniversary month 2 unlock date"
          git push
