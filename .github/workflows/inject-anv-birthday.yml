name: Inject Anv birthday layer

on:
  push:
    branches: [main]
    paths:
      - 'anv-birthday.js'
      - '.github/workflows/inject-anv-birthday.yml'

permissions:
  contents: write

jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[anv-birthday]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject birthday script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./anv-birthday.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace(marker, f'{tag}\n{marker}', 1)
              p.write_text(text, encoding='utf-8')
              print('Birthday layer injected.')
          else:
              print('Birthday layer already present.')
          PY

      - name: Commit injected script and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/inject-anv-birthday.yml
          git commit -m 'Add birthday themes and surprises [anv-birthday]'
          git push
