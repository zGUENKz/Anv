name: Fix anniversary month dates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix month unlock logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''function isMonthUnlocked(month){\n    if(month === 1) return new Date() >= new Date(CONFIG.startDate+"T00:00:00");\n    return new Date() >= monthDate(month+1);\n}'''
          new = '''function isMonthUnlocked(month){\n    return new Date() >= monthDate(month);\n}'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              old2 = '''function isMonthUnlocked(month){\n    return new Date() >= monthDate(month+1);\n}'''
              if old2 in s:
                  s = s.replace(old2, new, 1)
              elif new not in s:
                  raise SystemExit('Could not find isMonthUnlocked logic')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-month-dates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-month-dates.yml
          git diff --cached --quiet || git commit -m "Fix monthly anniversary dates [skip ci]"
          git push
