name: Fix anniversary month dates

on:
  push:
    paths:
      - '.github/workflows/fix-anniversary.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix month unlock logic
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''    d.setMonth(\n        d.getMonth() +\n        index -\n        1\n    );'''
          new = '''    // Month 1 = 1-month anniversary\n    // Month 2 = 2-month anniversary\n    d.setMonth(\n        d.getMonth() +\n        index\n    );'''

          if old not in s:
              raise SystemExit('monthDate pattern not found')
          s = s.replace(old, new, 1)

          old = '''    const months =\n        new Set([\n            ...allPhotos.map(\n                p => Number(p.month)\n            ),\n            ...allLetters.map(\n                l => Number(l.month)\n            )\n        ]);\n\n\n    $("monthStat").textContent =\n        months.size || 1;'''
          new = '''    let unlockedCount = 0;\n\n    for(let i = 1; i <= CONFIG.totalMonths; i++){\n        if(unlocked(i)){\n            unlockedCount++;\n        }\n    }\n\n    $("monthStat").textContent =\n        unlockedCount;'''

          if old not in s:
              raise SystemExit('renderStats pattern not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-anniversary.yml
          git commit -m "Fix anniversary month unlock dates"
          git push
