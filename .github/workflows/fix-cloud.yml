name: Fix cloud client

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''    supabaseClient =
        window.supabase.createClient(
            CONFIG.supabaseUrl,
            CONFIG.supabaseAnonKey
        );'''
          new = '''    // This site uses the public Supabase API directly and does not use Supabase Auth.
    // Disable persisted auth sessions so a stale/invalid JWT cannot break Storage/DB requests.
    supabaseClient =
        window.supabase.createClient(
            CONFIG.supabaseUrl,
            CONFIG.supabaseAnonKey,
            {
                auth:{
                    persistSession:false,
                    autoRefreshToken:false,
                    detectSessionInUrl:false
                }
            }
        );'''
          if old not in s:
              raise SystemExit('createClient block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix Supabase invalid JWT session issue"
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-cloud.yml
          git commit -m "Remove temporary cloud fix workflow"
          git push
