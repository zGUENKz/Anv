name: Patch Anniversary Code

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix anniversary calculations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          # Month 1 = Sep 5, Month 2 = Oct 5, etc.
          s = s.replace(
              'd.setMonth(d.getMonth()+month-1);',
              'd.setMonth(d.getMonth()+month);',
              1
          )

          old = '''function updateCounter(){
    const start=new Date(CONFIG.startDate+"T00:00:00");
    const now=new Date();
    const diff=Math.max(0,Math.floor((now-start)/86400000));
    $("daysTogether").textContent=`${diff} วัน`;
    const thisYear=new Date(now.getFullYear(),7,5);
    let next=thisYear;
    if(now>=next) next=new Date(now.getFullYear()+1,7,5);
    const days=Math.max(0,Math.ceil((next-now)/86400000));
    $("nextAnniv").innerHTML=`ครบรอบถัดไปใน <strong>${days} วัน</strong> · ${formatThaiDate(next)}`;
}'''

          new = '''function updateCounter(){
    const start=new Date(CONFIG.startDate+"T00:00:00");
    const now=new Date();
    const diff=Math.max(0,Math.floor((now-start)/86400000));
    $("daysTogether").textContent=`${diff} วัน`;

    // Next anniversary is always the next monthly anniversary.
    let nextMonth=1;
    while(monthDate(nextMonth) <= now && nextMonth < CONFIG.totalMonths) nextMonth++;
    const next=monthDate(nextMonth);
    const days=Math.max(0,Math.ceil((next-now)/86400000));
    $("nextAnniv").innerHTML=`ครบรอบถัดไปใน <strong>${days} วัน</strong> · ${formatThaiDate(next)}`;
}'''

          if old not in s:
              raise SystemExit("updateCounter target not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit fixed index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix next monthly anniversary counter [skip ci]"
          git push
