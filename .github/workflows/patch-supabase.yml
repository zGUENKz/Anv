name: Patch Supabase client
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          case "${GITHUB_EVENT_HEAD_COMMIT_MESSAGE:-}" in
            *"[skip ci]"*) echo "skip"; exit 0 ;;
          esac
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Fix monthly anniversary date helper:
          # Month 1 = 5 Sep 2026, Month 2 = 5 Oct 2026, etc.
          s = s.replace(
              'd.setMonth(d.getMonth()+month-1);',
              'd.setMonth(d.getMonth()+month);',
              1
          )

          # Fix the "next anniversary" counter so it shows the next monthly
          # anniversary instead of jumping to the next yearly anniversary.
          old_counter = '''function updateCounter(){
    const start=new Date(CONFIG.startDate+"T00:00:00");
    const now=new Date();
    const diff=Math.max(0,Math.floor((now-start)/86400000));
    $("daysTogether").textContent=`${diff} วัน`;
    const thisYear=new Date(now.getFullYear(),7,5);
    let next=thisYear;
    if(now>=next) next=new Date(now.getFullYear()+1,7,5);
    const days=Math.max(0,Math.ceil((next-now)/86400000));
    $("nextAnniv").innerHTML=`ครบรอบถัดไปใน <strong>${days} วัน</strong> · ${formatThaiDate(next)}`;
}'''
          new_counter = '''function updateCounter(){
    const start=new Date(CONFIG.startDate+"T00:00:00");
    const now=new Date();
    const diff=Math.max(0,Math.floor((now-start)/86400000));
    $("daysTogether").textContent=`${diff} วัน`;

    // Show the next monthly anniversary, not the next yearly anniversary.
    let nextMonth=1;
    while(monthDate(nextMonth) <= now && nextMonth < CONFIG.totalMonths) nextMonth++;
    const next=monthDate(nextMonth);
    const days=Math.max(0,Math.ceil((next-now)/86400000));
    $("nextAnniv").innerHTML=`ครบรอบถัดไปใน <strong>${days} วัน</strong> · ${formatThaiDate(next)}`;
}'''
          if old_counter in s:
              s = s.replace(old_counter, new_counter, 1)
          else:
              print('updateCounter target not found; no counter replacement made')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix next monthly anniversary counter [skip ci]'
          git push
