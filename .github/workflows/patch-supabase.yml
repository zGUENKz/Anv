name: Patch Supabase client
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          case "${GITHUB_EVENT_HEAD_COMMIT_MESSAGE:-}" in
            *"[skip ci]"*) echo "skip"; exit 0 ;;
          esac
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('d.setMonth(d.getMonth()+month-1);','d.setMonth(d.getMonth()+month);',1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix monthly anniversary dates [skip ci]'
          git push
