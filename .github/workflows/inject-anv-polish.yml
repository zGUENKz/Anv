name: Inject Anv final polish

on:
  push:
    branches: [main]
    paths:
      - 'anv-polish.js'
      - '.github/workflows/inject-anv-polish.yml'

permissions:
  contents: write

jobs:
  inject:
    if: "!contains(github.event.head_commit.message, '[anv-polish]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject polish script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./anv-polish.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace(marker, f'{tag}\n{marker}', 1)
              p.write_text(text, encoding='utf-8')
              print('Polish script injected.')
          else:
              print('Polish script already present.')
          PY

      - name: Commit injection and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/inject-anv-polish.yml
          git commit -m 'chore: inject Anv final polish [anv-polish]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
